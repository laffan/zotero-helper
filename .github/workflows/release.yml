name: Release

# Builds the app for macOS (Apple silicon + Intel), Windows and Linux and
# attaches the installers to a GitHub Release.
#
# Run it by pushing a tag that matches the version in src-tauri/tauri.conf.json:
#   git tag v1.0.0 && git push origin v1.0.0
# or from the Actions tab -> Release -> "Run workflow".
#
# The release is created as a draft. Review it on GitHub, then publish it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.args }}

      - run: npm ci

      # tauri.conf.json runs the frontend build itself (beforeBuildCommand).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # __VERSION__ is replaced with the version in tauri.conf.json.
          tagName: v__VERSION__
          releaseName: "Zotero Helper v__VERSION__"
          releaseBody: "Installers for macOS (Apple silicon and Intel), Windows and Linux are attached below. The builds are not code-signed, so macOS and Windows will warn the first time you open the app."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Gives the release assets plain names and keeps two downloads per system.
  rename-assets:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Rename and prune release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ZoteroHelper
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          release_id=$(gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"v$version\") | .id" | head -n1)
          gh api "repos/$REPO/releases/$release_id/assets" --paginate \
            --jq '.[] | [.id, .name] | @tsv' |
          while IFS="$(printf '\t')" read -r id name; do
            case "$name" in
              "$BASE-$version-"*) continue ;;  # already renamed
              *_aarch64.dmg)    new="$BASE-$version-AppleSilicon.dmg" ;;
              *_x64.dmg)        new="$BASE-$version-MacIntel.dmg" ;;
              *_x64-setup.exe)  new="$BASE-$version-Windows-Setup.exe" ;;
              *_x64_en-US.msi)  new="$BASE-$version-Windows.msi" ;;
              *_amd64.AppImage) new="$BASE-$version-Linux.AppImage" ;;
              *_amd64.deb)      new="$BASE-$version-Linux.deb" ;;
              *)                new="" ;;
            esac
            if [ -z "$new" ]; then
              echo "remove $name"
              gh api -X DELETE "repos/$REPO/releases/assets/$id"
            else
              echo "$name -> $new"
              gh api -X PATCH "repos/$REPO/releases/assets/$id" -f name="$new" >/dev/null
            fi
          done

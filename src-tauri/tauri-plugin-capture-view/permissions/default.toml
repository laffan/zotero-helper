"$schema" = "schemas/schema.json"

[[permission]]
identifier = "allow-register-listener"
description = "Allow JS to register a listener for this plugin's events (captured / navigated / failed) via addPluginListener()."
commands.allow = ["registerListener"]

[[permission]]
identifier = "allow-remove-listener"
description = "Allow JS to remove a previously registered plugin-event listener."
commands.allow = ["removeListener"]

[default]
description = "Default permissions: allow JS to subscribe to and unsubscribe from capture events. All actions (open/close/bounds/back/grab) are driven from the Rust core."
permissions = ["allow-register-listener", "allow-remove-listener"]

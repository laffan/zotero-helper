[package]
name = "zotero-helper"
version = "0.1.0"
description = "Companion app for Zotero on iPadOS/iOS/macOS: fetch PDFs for DOIs and push them to your library"
authors = ["Nate Laffan"]
edition = "2021"

[lib]
name = "zotero_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables the multiwebview API (Window::add_child) used by the
# embedded PDF-capture browser on desktop.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# In-app PDF capture browser for iPad (native WKWebView overlay).
tauri-plugin-capture-view = { path = "tauri-plugin-capture-view" }
tauri-plugin-share-sheet = { path = "tauri-plugin-share-sheet" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
# webpki-roots (bundled Mozilla root store) rather than native-roots:
# iOS has no enumerable system trust store, so native-roots TLS fails
# certificate verification on iPad while working fine on macOS.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "gzip",
  "rustls-tls-webpki-roots",
] }
thiserror = "2"
# Thumbnail cache: JPEGs cross the IPC boundary as base64.
base64 = "0.22"
dirs = "6"
md5 = "0.7"
regex = "1"
percent-encoding = "2"
html-escape = "0.2"
rand = "0.8"

[package]
name = "tauri-plugin-widget"
version = "0.1.0"
description = "iOS: the Continue Reading home-screen widget's data, and the links it opens the app with"
edition = "2021"
rust-version = "1.77"
links = "tauri-plugin-widget"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

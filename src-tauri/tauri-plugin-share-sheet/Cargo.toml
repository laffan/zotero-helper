[package]
name = "tauri-plugin-share-sheet"
version = "0.1.0"
description = "iOS share sheet (UIActivityViewController) for sharing files"
edition = "2021"
rust-version = "1.77"
links = "tauri-plugin-share-sheet"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "tauri-plugin-capture-view"
version = "0.1.0"
description = "iOS in-app browser overlay for capturing PDFs (WKWebView with download interception)"
edition = "2021"
rust-version = "1.77"
links = "tauri-plugin-capture-view"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

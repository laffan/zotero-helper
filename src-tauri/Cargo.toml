[package]
name = "zotero-helper"
version = "0.1.0"
description = "Companion app for Zotero on iPadOS/iOS/macOS: fetch PDFs for DOIs and push them to your library"
authors = ["Nate Laffan"]
edition = "2021"

[lib]
name = "zotero_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# "unstable" enables the multiwebview API (Window::add_child) used by the
# embedded PDF-capture browser on desktop.
tauri = { version = "2.12", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# In-app PDF capture browser for iPad (native WKWebView overlay).
tauri-plugin-capture-view = { path = "tauri-plugin-capture-view" }
tauri-plugin-share-sheet = { path = "tauri-plugin-share-sheet" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
# webpki-roots (bundled Mozilla root store) rather than native-roots:
# iOS has no enumerable system trust store, so native-roots TLS fails
# certificate verification on iPad while working fine on macOS.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "gzip",
  "rustls-tls-webpki-roots",
] }
thiserror = "2"
# Thumbnail cache: JPEGs cross the IPC boundary as base64.
base64 = "0.22"
dirs = "6"
md5 = "0.7"
regex = "1"
percent-encoding = "2"
html-escape = "0.2"
rand = "0.8"

# Xcode 27 builds static Swift products with `@_cdecl` exports made local,
# and swift-rs 1.0.8's fix-up (llvm-objcopy, from rustup's llvm-tools —
# see /rust-toolchain.toml) skips the SwiftRs runtime shim, so iOS release
# links fail on `_retain_object` / `_release_object` / `_string_from_bytes`.
# vendor/swift-rs is the published 1.0.8 with the three-line fix from
# Brendonovich/swift-rs#82 (issue #81). Remove this once a swift-rs release
# carries it.
[patch.crates-io]
swift-rs = { path = "vendor/swift-rs" }

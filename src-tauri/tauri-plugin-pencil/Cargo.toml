[package]
name = "tauri-plugin-pencil"
version = "0.1.0"
description = "iPadOS: the Apple Pencil's double-tap and squeeze, and the text-selection menu over the PDF"
edition = "2021"
rust-version = "1.77"
links = "tauri-plugin-pencil"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
